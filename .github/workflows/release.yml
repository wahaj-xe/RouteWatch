name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RouteWatch.sln

      - name: Publish Self-Contained Portable Binary
        run: >
          dotnet publish Routewatch/RouteWatch.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishProfile=win-x64-portable

      - name: Build WiX MSI Package
        run: >
          dotnet build Routewatch.Installer/RouteWatch.Installer.wixproj
          -c Release
          -p:SuppressValidation=true

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Routewatch/RouteWatch-Installer.iss

      - name: Package Portable ZIP & Gather Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.0" }
          Compress-Archive -Path Routewatch/bin/Publish/win-x64-portable/* -DestinationPath "artifacts/RouteWatch-$version-win-x64-portable.zip" -Force
          Copy-Item Routewatch.Installer/bin/x64/Release/RouteWatch-1.0.0-Setup.msi "artifacts/RouteWatch-$version-Setup.msi" -Force

          # Generate SHA256 checksums
          Get-ChildItem -Path artifacts/* | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content artifacts/checksums.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouteWatch-Release-Artifacts
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME
          gh release create $ver artifacts/* `
            --title "RouteWatch $ver" `
            --generate-notes
