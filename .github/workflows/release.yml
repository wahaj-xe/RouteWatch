name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PortMTR.Enterprise.sln

      - name: Publish portable build
        run: >
          dotnet publish PortMTR.Enterprise/PortMTR.Enterprise.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishProfile=win-x64-portable

      - name: Build MSI
        run: >
          dotnet build PortMTR.Installer/PortMTR.Installer.wixproj
          -c Release
          -p:SuppressValidation=true

      - name: Create artifact folder
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Package portable ZIP
        shell: pwsh
        run: >
          Compress-Archive
          -Path PortMTR.Enterprise/bin/Publish/win-x64-portable/*
          -DestinationPath artifacts/PortMTR.Enterprise-win-x64-portable.zip
          -Force

      - name: Copy MSI
        shell: pwsh
        run: Copy-Item PortMTR.Installer/bin/x64/Release/PortMTR.Installer.msi artifacts/PortMTR.Installer.msi -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortMTR-Enterprise-Windows
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          artifacts/PortMTR.Installer.msi
          artifacts/PortMTR.Enterprise-win-x64-portable.zip
          --title "PortMTR Enterprise $env:GITHUB_REF_NAME"
          --notes "Windows x64 release. Install with the MSI or extract the portable ZIP. Npcap is required for TCP/UDP capture modes."
