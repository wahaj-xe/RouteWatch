name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tags must use the vMAJOR.MINOR.PATCH format."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RouteWatch.sln

      - name: Publish Self-Contained Portable Binary
        run: >
          dotnet publish Routewatch/RouteWatch.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishProfile=win-x64-portable

      - name: Prepare Release Output Directory
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Build WiX MSI Package
        run: >
          dotnet build Routewatch.Installer/RouteWatch.Installer.wixproj
          -c Release
          -p:ProductVersion=${{ steps.version.outputs.version }}
          -p:SuppressValidation=true

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Routewatch/RouteWatch-Installer.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - name: Package Portable ZIP & Gather Artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path Routewatch/bin/Publish/win-x64-portable/* -DestinationPath "artifacts/RouteWatch-$version-win-x64-portable.zip" -Force
          Copy-Item Routewatch.Installer/bin/x64/Release/RouteWatch.msi artifacts/RouteWatch.msi -Force

          $expectedFiles = @(
            "artifacts/RouteWatch-$version-Setup.exe",
            "artifacts/RouteWatch.msi",
            "artifacts/RouteWatch-$version-win-x64-portable.zip"
          )
          foreach ($file in $expectedFiles) {
            if (-not (Test-Path $file)) {
              throw "Expected release artifact was not created: $file"
            }
          }

          # Generate SHA256 checksums
          Get-ChildItem -Path artifacts/* -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/checksums.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouteWatch-Release-Artifacts
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME
          gh release create $ver artifacts/* `
            --title "RouteWatch $ver" `
            --generate-notes
